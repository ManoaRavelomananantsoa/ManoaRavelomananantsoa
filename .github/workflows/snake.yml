name: Snake Graph

# Déclenche le workflow tous les jours à minuit et manuellement
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    steps:
      # Récupérer le repo
      - uses: actions/checkout@v3

      # Installer Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Installer github-contribution-grid-snake depuis GitHub
      - name: Install github-contribution-grid-snake
        run: npm install https://github.com/Ashutosh00710/github-contribution-grid-snake.git

      # Créer le dossier output si inexistant
      - name: Create output folder
        run: mkdir -p output

      # Générer le SVG
      - name: Generate Snake SVG
        run: npx github-contribution-grid-snake --file ./output/github-contribution-grid-snake.svg

      # Commit et push du SVG
      - name: Commit & Push SVG
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output/github-contribution-grid-snake.svg
          git commit -m "Update snake contribution graph" || echo "No changes to commit"
          git push